<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Weber Web Services</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css"> <!-- External styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div class="page-container" x-data="{ formType: 'general' }">
    <header class="bg-gray-800 text-white p-6">
      <nav aria-label="Main navigation">
        <ul class="flex space-x-4">
          <li><a href="index.html" class="hover:text-gray-400">Home</a></li>
          <li><a href="about.html" class="hover:text-gray-400">About</a></li>
          <li><a href="services.html" class="hover:text-gray-400">Services</a></li>
          <li><a href="pricing.html" class="hover:text-gray-400">Pricing</a></li>
          <li><a href="contact.html" class="hover:text-gray-400">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container mx-auto p-6">
      <section class="text-center my-8">
        <h1 class="text-4xl font-bold">Contact Us</h1>
        <p class="mt-4 text-lg">Choose the type of inquiry or service quote, and fill out the corresponding form below.</p>
      </section>

      <section class="my-12 p-8 bg-gray-100 rounded-lg">
        <div class="mb-6">
          <label for="inquiryType" class="block text-lg font-medium text-gray-700">Inquiry Type</label>
          <select id="inquiryType" x-model="formType" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
            <option value="general">General Inquiry</option>
            <option value="webdev">Quote - Web Development</option>
            <option value="webdesign">Quote - Web Design</option>
            <option value="itconsulting">Quote - IT Consulting</option>
          </select>
        </div>

        <!-- General Inquiry Form -->
        <form action="#" method="POST" class="grid grid-cols-1 gap-6" x-show="formType === 'general'" onsubmit="sendEmail('general'); return false;">
          <div>
            <label for="name" class="block text-lg font-medium text-gray-700">Name</label>
            <input type="text" id="name" name="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="email" class="block text-lg font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="subject" class="block text-lg font-medium text-gray-700">Subject</label>
            <input type="text" id="subject" name="subject" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="message" class="block text-lg font-medium text-gray-700">Message</label>
            <textarea id="message" name="message" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700 transition-transform transform hover:scale-110">Submit</button>
          </div>
        </form>

        <!-- Additional Forms -->
        <form action="#" method="POST" class="grid grid-cols-1 gap-6" x-show="formType === 'webdev'" onsubmit="sendEmail('webdev'); return false;">
          <div>
            <label for="name" class="block text-lg font-medium text-gray-700">Name</label>
            <input type="text" id="name" name="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="email" class="block text-lg font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="projectDetails" class="block text-lg font-medium text-gray-700">Project Details</label>
            <textarea id="projectDetails" name="projectDetails" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Describe the website you want built" required></textarea>
          </div>
          <div>
            <label for="budget" class="block text-lg font-medium text-gray-700">Estimated Budget</label>
            <input type="text" id="budget" name="budget" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="timeline" class="block text-lg font-medium text-gray-700">Timeline</label>
            <input type="text" id="timeline" name="timeline" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div class="text-center">
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700 transition-transform transform hover:scale-110">Submit Web Development Quote</button>
          </div>
        </form>

        <form action="#" method="POST" class="grid grid-cols-1 gap-6" x-show="formType === 'webdesign'" onsubmit="sendEmail('webdesign'); return false;">
          <div>
            <label for="name" class="block text-lg font-medium text-gray-700">Name</label>
            <input type="text" id="name" name="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="email" class="block text-lg font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="designDetails" class="block text-lg font-medium text-gray-700">Design Project Details</label>
            <textarea id="designDetails" name="designDetails" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Describe the design needs for your project" required></textarea>
          </div>
          <div>
            <label for="brandGuidelines" class="block text-lg font-medium text-gray-700">Brand Guidelines</label>
            <input type="text" id="brandGuidelines" name="brandGuidelines" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Link or describe your brand guidelines" required>
          </div>
          <div class="text-center">
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700 transition-transform transform hover:scale-110">Submit Web Design Quote</button>
          </div>
        </form>

        <form action="#" method="POST" class="grid grid-cols-1 gap-6" x-show="formType === 'itconsulting'" onsubmit="sendEmail('itconsulting'); return false;">
          <div>
            <label for="name" class="block text-lg font-medium text-gray-700">Name</label>
            <input type="text" id="name" name="name" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="email" class="block text-lg font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="consultingDetails" class="block text-lg font-medium text-gray-700">Consulting Project Details</label>
            <textarea id="consultingDetails" name="consultingDetails" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Describe your consulting needs" required></textarea>
          </div>
          <div>
            <label for="servicesNeeded" class="block text-lg font-medium text-gray-700">Services Needed</label>
            <input type="text" id="servicesNeeded" name="servicesNeeded" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div>
            <label for="timeline" class="block text-lg font-medium text-gray-700">Timeline</label>
            <input type="text" id="timeline" name="timeline" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
          </div>
          <div class="text-center">
            <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700 transition-transform transform hover:scale-110">Submit IT Consulting Quote</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="bg-gray-800 text-white p-6 text-center">
      <p>&copy; 2024 Weber Web Services. All rights reserved.</p>
    </footer>
  </div>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="./js/scripts.js"></script>
  <script type="text/javascript">
    (function(){
      emailjs.init("CjZDuFUzd3F9l50Vl"); 
    })();
  </script>
  
</body>
</html>
