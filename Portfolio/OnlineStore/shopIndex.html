<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store</title>
    <link rel="stylesheet" href="./css/stylesEstore.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="../OnlineStore/shopIndex.html" class="logo" aria-label="Homepage">My E-Store</a>
            <nav>
                <ul>
                    <li><a href="#featured-products">Featured Products</a></li>
                    <li><a href="../OnlineStore/contact.html">Contact</a></li>
                </ul>
            </nav>
            <a href="../../index.html" class="return-to-resume-btn">Return to Resume</a>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to My E-Store</h1>
            <p>Your one-stop shop for everything you need.</p>
        </section>
        <section id="featured-products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <article class="product">
                    <img src="./img/product1.jpg" alt="Product 1 description">
                    <h3>Product 1</h3>
                    <p class="price">$19.99</p>
                    <a href="product1.html">View Details</a>
                </article>
                <article class="product">
                    <img src="./img/product2.jpg" alt="Product 2 description">
                    <h3>Product 2</h3>
                    <p class="price">$29.99</p>
                    <a href="product2.html">View Details</a>
                </article>
                <!-- Add more products as needed -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 E-store Example</p>
    </footer>
</body>
</html>
