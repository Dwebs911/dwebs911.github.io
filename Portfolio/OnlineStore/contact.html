<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Store</title>
    <link rel="stylesheet" href="./css/stylesEstore.css"> <!-- Link to your main CSS file -->
</head>
<body>
    <header>
        <div class="container">
            <a href="../OnlineStore/shopIndex.html" class="logo" aria-label="Homepage">My E-Store</a>
            <nav>
                <ul>
                    <li><a href="../OnlineStore/shopIndex.html">Featured Products</a></li>
                    <li><a href="../OnlineStore/contact.html">Contact</a></li>
                </ul>
            </nav>
            <a href="../../index.html" class="return-to-resume-btn">Return to Resume</a>
        </div>
    </header>

    <main>
        <section class="contact">
            <div class="container">
                <h1>Contact Us</h1>
                <p>If you have any questions or need further information, feel free to reach out to us using the form below.</p>
                
                <form action="submit_form.php" method="post" class="contact-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                    
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 E-store Example</p>
    </footer>
</body>
</html>
